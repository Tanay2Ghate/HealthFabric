# ---------------------------------------------------------------------------
# docker-compose-fabric.yaml
# Full HealthChain Fabric 2.5 network: 3 orgs, 6 peers, 1 orderer,
# 3 CouchDB instances, 3 CAs, and 1 CLI container.
# ---------------------------------------------------------------------------

version: '3.9'

networks:
  healthchain:
    name: healthchain
    driver: bridge

volumes:
  orderer.healthchain.com:
  peer0.hospitala.healthchain.com:
  peer1.hospitala.healthchain.com:
  peer0.hospitalb.healthchain.com:
  peer1.hospitalb.healthchain.com:
  peer0.diaglab.healthchain.com:
  peer1.diaglab.healthchain.com:
  couchdb0:
  couchdb1:
  couchdb2:

services:

  # ---------------------------------------------------------------------------
  # Fabric Tools (cryptogen / configtxgen helper container)
  # ---------------------------------------------------------------------------
  fabric-tools:
    image: hyperledger/fabric-tools:2.5
    container_name: fabric-tools
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - FABRIC_CFG_PATH=/etc/hyperledger/config
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    volumes:
      - /var/run/:/host/var/run/
      - ../config:/etc/hyperledger/config
      - ../organizations:/etc/hyperledger/fabric/organizations
      - ../channel-artifacts:/etc/hyperledger/fabric/channel-artifacts
    networks:
      - healthchain
    command: /bin/bash

  # ---------------------------------------------------------------------------
  # Orderer
  # ---------------------------------------------------------------------------
  orderer.healthchain.com:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.healthchain.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      # TLS
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      # Bootstrap
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:17050
      # Consensus storage
      - ORDERER_CONSENSUS_WALDIR=/var/hyperledger/production/orderer/etcdraft/wal
      - ORDERER_CONSENSUS_SNAPDIR=/var/hyperledger/production/orderer/etcdraft/snapshot
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ../organizations/ordererOrganizations/orderer.healthchain.com/orderers/orderer.orderer.healthchain.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/orderer.healthchain.com/orderers/orderer.orderer.healthchain.com/tls:/var/hyperledger/orderer/tls
      - orderer.healthchain.com:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
      - "17050:17050"
    networks:
      - healthchain

  # ---------------------------------------------------------------------------
  # CouchDB instances (one per org's peer0)
  # ---------------------------------------------------------------------------
  couchdb0:
    image: couchdb:3.3
    container_name: couchdb0
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    volumes:
      - couchdb0:/opt/couchdb/data
    ports:
      - "5984:5984"
    networks:
      - healthchain

  couchdb1:
    image: couchdb:3.3
    container_name: couchdb1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    volumes:
      - couchdb1:/opt/couchdb/data
    ports:
      - "6984:5984"
    networks:
      - healthchain

  couchdb2:
    image: couchdb:3.3
    container_name: couchdb2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    volumes:
      - couchdb2:/opt/couchdb/data
    ports:
      - "7984:5984"
    networks:
      - healthchain

  # ---------------------------------------------------------------------------
  # Peers – Hospital A
  # ---------------------------------------------------------------------------
  peer0.hospitala.healthchain.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.hospitala.healthchain.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=healthchain
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.hospitala.healthchain.com
      - CORE_PEER_ADDRESS=peer0.hospitala.healthchain.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.hospitala.healthchain.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.hospitala.healthchain.com:7061
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.hospitala.healthchain.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:17051
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/hospitala.healthchain.com/peers/peer0.hospitala.healthchain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/hospitala.healthchain.com/peers/peer0.hospitala.healthchain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.hospitala.healthchain.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    depends_on:
      - couchdb0
    ports:
      - "7051:7051"
      - "17051:17051"
    networks:
      - healthchain

  peer1.hospitala.healthchain.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer1.hospitala.healthchain.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=healthchain
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer1.hospitala.healthchain.com
      - CORE_PEER_ADDRESS=peer1.hospitala.healthchain.com:7061
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7061
      - CORE_PEER_CHAINCODEADDRESS=peer1.hospitala.healthchain.com:7062
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7062
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.hospitala.healthchain.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.hospitala.healthchain.com:7061
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:17061
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/hospitala.healthchain.com/peers/peer1.hospitala.healthchain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/hospitala.healthchain.com/peers/peer1.hospitala.healthchain.com/tls:/etc/hyperledger/fabric/tls
      - peer1.hospitala.healthchain.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "7061:7061"
      - "17061:17061"
    networks:
      - healthchain

  # ---------------------------------------------------------------------------
  # Peers – Hospital B
  # ---------------------------------------------------------------------------
  peer0.hospitalb.healthchain.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.hospitalb.healthchain.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=healthchain
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.hospitalb.healthchain.com
      - CORE_PEER_ADDRESS=peer0.hospitalb.healthchain.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.hospitalb.healthchain.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.hospitalb.healthchain.com:8061
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.hospitalb.healthchain.com:8051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:18051
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/hospitalb.healthchain.com/peers/peer0.hospitalb.healthchain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/hospitalb.healthchain.com/peers/peer0.hospitalb.healthchain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.hospitalb.healthchain.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    depends_on:
      - couchdb1
    ports:
      - "8051:8051"
      - "18051:18051"
    networks:
      - healthchain

  peer1.hospitalb.healthchain.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer1.hospitalb.healthchain.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=healthchain
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer1.hospitalb.healthchain.com
      - CORE_PEER_ADDRESS=peer1.hospitalb.healthchain.com:8061
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8061
      - CORE_PEER_CHAINCODEADDRESS=peer1.hospitalb.healthchain.com:8062
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8062
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.hospitalb.healthchain.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.hospitalb.healthchain.com:8061
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:18061
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/hospitalb.healthchain.com/peers/peer1.hospitalb.healthchain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/hospitalb.healthchain.com/peers/peer1.hospitalb.healthchain.com/tls:/etc/hyperledger/fabric/tls
      - peer1.hospitalb.healthchain.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "8061:8061"
      - "18061:18061"
    networks:
      - healthchain

  # ---------------------------------------------------------------------------
  # Peers – Diagnostic Lab
  # ---------------------------------------------------------------------------
  peer0.diaglab.healthchain.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.diaglab.healthchain.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=healthchain
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.diaglab.healthchain.com
      - CORE_PEER_ADDRESS=peer0.diaglab.healthchain.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.diaglab.healthchain.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.diaglab.healthchain.com:9061
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.diaglab.healthchain.com:9051
      - CORE_PEER_LOCALMSPID=Org3MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:19051
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb2:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/diaglab.healthchain.com/peers/peer0.diaglab.healthchain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/diaglab.healthchain.com/peers/peer0.diaglab.healthchain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.diaglab.healthchain.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    depends_on:
      - couchdb2
    ports:
      - "9051:9051"
      - "19051:19051"
    networks:
      - healthchain

  peer1.diaglab.healthchain.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer1.diaglab.healthchain.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=healthchain
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer1.diaglab.healthchain.com
      - CORE_PEER_ADDRESS=peer1.diaglab.healthchain.com:9061
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9061
      - CORE_PEER_CHAINCODEADDRESS=peer1.diaglab.healthchain.com:9062
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9062
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.diaglab.healthchain.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.diaglab.healthchain.com:9061
      - CORE_PEER_LOCALMSPID=Org3MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:19061
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/diaglab.healthchain.com/peers/peer1.diaglab.healthchain.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/diaglab.healthchain.com/peers/peer1.diaglab.healthchain.com/tls:/etc/hyperledger/fabric/tls
      - peer1.diaglab.healthchain.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "9061:9061"
      - "19061:19061"
    networks:
      - healthchain

  # ---------------------------------------------------------------------------
  # Certificate Authorities
  # ---------------------------------------------------------------------------
  ca.hospitala.healthchain.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.hospitala.healthchain.com
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-hospitala
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    volumes:
      - ../organizations/fabric-ca/hospitala:/etc/hyperledger/fabric-ca-server
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    ports:
      - "7054:7054"
      - "17054:17054"
    networks:
      - healthchain

  ca.hospitalb.healthchain.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.hospitalb.healthchain.com
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-hospitalb
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:18054
    volumes:
      - ../organizations/fabric-ca/hospitalb:/etc/hyperledger/fabric-ca-server
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    ports:
      - "8054:8054"
      - "18054:18054"
    networks:
      - healthchain

  ca.diaglab.healthchain.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.diaglab.healthchain.com
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-diaglab
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:19054
    volumes:
      - ../organizations/fabric-ca/diaglab:/etc/hyperledger/fabric-ca-server
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    ports:
      - "9054:9054"
      - "19054:19054"
    networks:
      - healthchain

  # ---------------------------------------------------------------------------
  # CLI – admin operations container
  # ---------------------------------------------------------------------------
  cli:
    image: hyperledger/fabric-tools:2.5
    container_name: cli
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - FABRIC_CFG_PATH=/etc/hyperledger/config
      # Default context: peer0 of HospitalA
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.hospitala.healthchain.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/hospitala.healthchain.com/peers/peer0.hospitala.healthchain.com/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/hospitala.healthchain.com/peers/peer0.hospitala.healthchain.com/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/hospitala.healthchain.com/peers/peer0.hospitala.healthchain.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/hospitala.healthchain.com/users/Admin@hospitala.healthchain.com/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/:/host/var/run/
      - ../organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto
      - ../channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../config:/etc/hyperledger/config
      - ../../chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode
    depends_on:
      - orderer.healthchain.com
      - peer0.hospitala.healthchain.com
      - peer1.hospitala.healthchain.com
      - peer0.hospitalb.healthchain.com
      - peer1.hospitalb.healthchain.com
      - peer0.diaglab.healthchain.com
      - peer1.diaglab.healthchain.com
    networks:
      - healthchain
